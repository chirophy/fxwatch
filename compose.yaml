name: fxwatch

services:
  app:
    image: ${FXWATCH_IMAGE:-chirophy/fxwatch:1.3.0}
    build:
      context: .
    container_name: fxwatch
    restart: unless-stopped
    stop_grace_period: 90s
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      FXWATCH_CONFIG: /data/config.toml
      TZ: Asia/Shanghai
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "${FXWATCH_BIND_IP:-0.0.0.0}:8099:8099"
    volumes:
      - data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
    name: fxwatch-data
